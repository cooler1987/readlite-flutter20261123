name: Build Android APK and Windows Portable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # 支持在 GitHub 网页手动一键触发打包

jobs:
  # ==================== 1. 安卓端构建 (Android APK) ====================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 云端补齐平台工程 (指定项目名，规避仓库名中划线)
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --project-name weread_lite_flutter
          cp pubspec.yaml.bak pubspec.yaml
          rm -rf lib

      - name: 安装依赖
        run: flutter pub get

      - name: 编译 Android APK (显式指向根目录 main.dart)
        run: flutter build apk --release --split-per-abi -t main.dart

      - name: 归档上传 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: weread-lite-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7

  # ==================== 2. PC 桌面便携版构建 (Windows Portable) ====================
  build-windows:
    name: Build Windows PC Portable
    runs-on: windows-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 MSVC 环境 (激活 VS 2022 编译工具链)
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置 Flutter 环境
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 启用 Windows 桌面开发支持
        run: flutter config --enable-windows-desktop

      - name: 云端补齐 Windows 桌面宿主 (指定项目名，规避仓库名中划线)
        run: |
          Copy-Item pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=windows --project-name weread_lite_flutter
          Copy-Item pubspec.yaml.bak pubspec.yaml -Force
          if (Test-Path lib) { Remove-Item -Recurse -Force lib }

      - name: 安装依赖
        run: flutter pub get

      - name: 编译 Windows 桌面端 Release (强制指定 VS 2022 生成器)
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
        run: flutter build windows --release -t main.dart

      - name: 打包为免安装便携版 ZIP (绿色单文件包)
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath weread-lite-windows-portable.zip -Force

      - name: 归档上传 Windows 便携版 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: weread-lite-windows-portable
          path: weread-lite-windows-portable.zip
          retention-days: 7
