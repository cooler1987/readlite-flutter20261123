name: Build Android APK and Windows Portable

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==================== 1. 安卓端构建 (仅 arm64-v8a) ====================
  build-android:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 配置 Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: 云端补齐 Android 工程与标准入口
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=android --project-name weread_lite_flutter
          cp pubspec.yaml.bak pubspec.yaml
          mkdir -p lib
          cp main.dart lib/main.dart
          cp tts_backend_mobile.dart lib/tts_backend.dart

      - name: 配置 Android 网络权限与明文 HTTP 支持
        run: |
          python3 -c '
          p = "android/app/src/main/AndroidManifest.xml"
          xml = open(p, encoding="utf-8").read()
          if "android.permission.INTERNET" not in xml:
              xml = xml.replace("<application", "    <uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application", 1)
          if "usesCleartextTraffic" not in xml:
              xml = xml.replace("<application", "<application android:usesCleartextTraffic=\"true\"", 1)
          open(p, "w", encoding="utf-8").write(xml)
          '

      - name: 安装依赖
        run: flutter pub get

      - name: 编译 Android APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: 归档上传 APK 安装包
        uses: actions/upload-artifact@v4
        with:
          name: weread-lite-android-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7

  # ==================== 2. PC 桌面便携版构建 (Windows X64 Portable) ====================
  build-windows:
    name: Build Windows X64 Portable
    runs-on: windows-2022

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1

      - name: 配置 Flutter 3.44.9
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: 启用 Windows 桌面支持
        run: flutter config --enable-windows-desktop

      - name: 云端补齐 Windows 工程并剥离高危原生音频插件
        run: |
          Copy-Item pubspec.yaml pubspec.yaml.bak
          flutter create . --platforms=windows --project-name weread_lite_flutter
          $pub = Get-Content pubspec.yaml.bak -Raw -Encoding UTF8
          $pub = $pub -replace '(?m)^\s*flutter_tts:[^\r\n]*\r?\n?', ''
          $pub = $pub -replace '(?m)^\s*audioplayers:[^\r\n]*\r?\n?', ''
          [System.IO.File]::WriteAllText((Resolve-Path pubspec.yaml).Path, $pub, [System.Text.UTF8Encoding]::new($false))
          New-Item -ItemType Directory -Force -Path lib | Out-Null
          Copy-Item main.dart lib\main.dart -Force
          Copy-Item tts_backend_win.dart lib\tts_backend.dart -Force

      - name: 注入 Win10 1909 兼容宏、立即显示窗口与原生崩溃弹窗
        run: |
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)

          $cmakePath = (Resolve-Path "windows\CMakeLists.txt").Path
          $cmakeTxt = [System.IO.File]::ReadAllText($cmakePath, $utf8NoBom)
          if (-not $cmakeTxt.Contains("_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR")) {
            $cmakeTxt = $cmakeTxt -replace '(?m)^(project\([^\r\n]+\))', ('$1' + "`r`nadd_compile_definitions(_DISABLE_CONSTEXPR_MUTEX_CONSTRUCTOR)")
            [System.IO.File]::WriteAllText($cmakePath, $cmakeTxt, $utf8NoBom)
          }

          $fwPath = (Resolve-Path "windows\runner\flutter_window.cpp").Path
          $fwTxt = [System.IO.File]::ReadAllText($fwPath, $utf8NoBom)
          $fwTxt = $fwTxt -replace 'flutter_controller_->ForceRedraw\(\);', "flutter_controller_->ForceRedraw();`r`n  this->Show();"
          [System.IO.File]::WriteAllText($fwPath, $fwTxt, $utf8NoBom)

          $mainPath = (Resolve-Path "windows\runner\main.cpp").Path
          $mainTxt = [System.IO.File]::ReadAllText($mainPath, $utf8NoBom)
          $crashHook = @(
            '#include <windows.h>',
            '#include <stdio.h>',
            '',
            'static LONG WINAPI WereadUnhandledCrashFilter(EXCEPTION_POINTERS* info) {',
            '  wchar_t msg[512] = {};',
            '  unsigned long code = info && info->ExceptionRecord ? info->ExceptionRecord->ExceptionCode : 0;',
            '  void* addr = info && info->ExceptionRecord ? info->ExceptionRecord->ExceptionAddress : nullptr;',
            '  swprintf_s(msg, 512, L"程序启动发生原生异常，错误码: 0x%08lX\n地址: %p", code, addr);',
            '  MessageBoxW(nullptr, msg, L"Weread Lite 启动错误", MB_OK | MB_ICONERROR);',
            '  return EXCEPTION_EXECUTE_HANDLER;',
            '}',
            ''
          ) -join "`r`n"

          if (-not $mainTxt.Contains("WereadUnhandledCrashFilter")) {
            $mainTxt = $mainTxt -replace 'int APIENTRY wWinMain', ($crashHook + 'int APIENTRY wWinMain')
            $mainTxt = $mainTxt -replace '(int APIENTRY wWinMain\([^\)]*\)\s*\{)', ('$1' + "`r`n  SetUnhandledExceptionFilter(WereadUnhandledCrashFilter);")
            [System.IO.File]::WriteAllText($mainPath, $mainTxt, $utf8NoBom)
          }

      - name: 安装依赖
        run: flutter pub get

      - name: 编译 Windows X64 Release
        run: flutter build windows --release

      - name: 内嵌配套 VC++ 运行库 CRT DLL
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          $crtDirs = @()
          if ($env:VCToolsRedistDir -and (Test-Path "$($env:VCToolsRedistDir)\x64\Microsoft.VC143.CRT")) {
            $crtDirs += "$($env:VCToolsRedistDir)\x64\Microsoft.VC143.CRT"
          }
          $crtDirs += Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Directory -Filter "Microsoft.VC143.CRT" -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*\x64\*" } |
            Select-Object -ExpandProperty FullName
          $copied = $false
          foreach ($dir in $crtDirs) {
            if (Test-Path $dir) {
              Copy-Item "$dir\*.dll" -Destination $releaseDir -Force
              $copied = $true
              break
            }
          }
          if (-not $copied) {
            Write-Warning "未找到 VC143.CRT 目录，回退到 System32"
            foreach ($dll in @("msvcp140.dll","msvcp140_1.dll","msvcp140_2.dll","msvcp140_atomic_wait.dll","vcruntime140.dll","vcruntime140_1.dll","concrt140.dll")) {
              if (Test-Path "C:\Windows\System32\$dll") {
                Copy-Item "C:\Windows\System32\$dll" -Destination $releaseDir -Force
              }
            }
          }

      - name: 归档上传 Windows X64 便携版 (单层 ZIP，不套娃)
        uses: actions/upload-artifact@v4
        with:
          name: weread-lite-windows-x64-portable
          path: build/windows/x64/runner/Release
          retention-days: 7
